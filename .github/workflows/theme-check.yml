name: Theme Check

on:
  pull_request:
    branches: [kladde, main]

permissions:
  contents: read

jobs:
  theme-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Kør Theme Check
        run: npx --yes @shopify/cli@5.0.2 theme check --fail-level error
